<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <title>Shift calendar</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f1f5f9;
      --surface: #fff;
      --surface-2: #e8eef5;
      --text: #172334;
      --muted: #64748b;
      --border: #cbd5e1;
      --blue: #1976d2;
      --blue-strong: #0b5cad;
      --early: #e5a914;
      --mid: #159d91;
      --late: #8750c9;
      --night: #304c9b;
      --off: #64748b;
      --danger: #e34f4f;
      --weekend: #fff6cf;
      --today: #dcecff;
      --shadow: 0 16px 48px #0f172a24;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10151d;
        --surface: #17212d;
        --surface-2: #1c2938;
        --text: #eef4fb;
        --muted: #9aacc1;
        --border: #2b3b4e;
        --blue: #56a8f4;
        --blue-strong: #8bc5ff;
        --weekend: #3c3821;
        --today: #203b58;
        --shadow: 0 16px 48px #0008;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    button, input, textarea { font: inherit; }
    button {
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--surface-2);
      font-weight: 650;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent);
      outline-offset: 2px;
    }
    button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    @media (prefers-color-scheme: dark) {
      button.primary { color: #071523; }
    }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .app { width: min(100%, 520px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 1.35rem; margin: 8px 0; letter-spacing: -.025em; }
    h2, h3, p { margin-top: 0; }
    h2 { font-size: 1.08rem; margin-bottom: 12px; }
    .lang { display: flex; gap: 6px; }
    .lang button { min-height: 38px; padding: 6px 12px; border-radius: 10px; }
    .lang button.active { background: var(--blue); color: white; border-color: var(--blue); }
    @media (prefers-color-scheme: dark) { .lang button.active { color: #071523; } }
    .month-nav { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto 46px; gap: 8px; align-items: center; margin: 2px 0 12px; }
    .month-nav button { padding: 0; font-size: 1.35rem; }
    .month-nav #todayButton { min-height: 42px; padding: 6px 12px; font-size: .82rem; }
    .month-nav h2 { text-align: center; margin: 0; text-transform: capitalize; }
    .card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      margin: 10px 0;
    }
    .next-card { background: #4a9ee9; color: #061b2f; border-color: transparent; }
    .next-card .muted { color: #183c5b; }
    .next-title, .metric-label { font-size: .9rem; }
    .next-main { font-size: 1.08rem; font-weight: 760; margin: 4px 0 0; }
    .stats { display: block; }
    .hours-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
    .hours-breakdown > div { display: grid; gap: 3px; }
    .hours-label { color: var(--muted); font-size: .75rem; }
    .hours-value { font-size: 1.2rem; font-weight: 760; white-space: nowrap; }
    .subline, .muted { color: var(--muted); font-size: .78rem; line-height: 1.45; }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
    .views:has(#dayView) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .views button.selected { background: var(--surface); color: var(--blue-strong); }
    .weekday-row, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .weekday-row { color: var(--muted); font-size: .7rem; text-align: center; padding: 0 0 4px; }
    .day-cell {
      min-height: 66px;
      position: relative;
      padding: 8px 2px 4px;
      border: 1px solid var(--border);
      border-top: 4px solid var(--off);
      border-radius: 9px;
      background: var(--surface);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 3px;
      font-size: .68rem;
      line-height: 1.15;
      min-width: 0;
    }
    .day-cell.weekend { background: var(--surface); }
    .day-cell.weekend .number { color: var(--blue); }
    .day-cell.today { box-shadow: inset 0 0 0 1px var(--blue); background: var(--today); }
    .day-cell .number { font-weight: 760; font-size: .77rem; }
    .day-cell .time { font-variant-numeric: tabular-nums; }
    .day-cell .overnight { font-size: .6rem; color: var(--muted); }
    .day-cell.changed::after {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      position: absolute;
      top: 4px;
      right: 4px;
    }
    .day-cell.color-early { background: color-mix(in srgb, var(--early) 24%, var(--surface)); border-top-color: var(--early); }
    .day-cell.color-mid { background: color-mix(in srgb, var(--mid) 24%, var(--surface)); border-top-color: var(--mid); }
    .day-cell.color-late { background: color-mix(in srgb, var(--late) 24%, var(--surface)); border-top-color: var(--late); }
    .day-cell.color-night { background: color-mix(in srgb, var(--night) 30%, var(--surface)); border-top-color: var(--night); }
    .day-cell.color-off { border-top-color: var(--off); }
    .blank-cell { min-height: 1px; }
    .list { display: grid; gap: 6px; }
    .list-row {
      display: grid;
      grid-template-columns: minmax(86px, 1fr) minmax(100px, 1.4fr);
      gap: 6px;
      align-items: center;
      text-align: left;
      padding: 10px;
      min-height: 58px;
      background: var(--surface);
    }
    .list-row.color-early { background: color-mix(in srgb, var(--early) 24%, var(--surface)); }
    .list-row.color-mid { background: color-mix(in srgb, var(--mid) 24%, var(--surface)); }
    .list-row.color-late { background: color-mix(in srgb, var(--late) 24%, var(--surface)); }
    .list-row.color-night { background: color-mix(in srgb, var(--night) 30%, var(--surface)); }
    .list-row.weekend .list-date { color: var(--blue); }
    .list-row.today { box-shadow: inset 0 0 0 1px var(--blue); }
    .list-row .list-date { font-weight: 650; }
    .list-row .list-time { font-variant-numeric: tabular-nums; }
    .day-plan { display: grid; gap: 8px; }
    .day-plan-nav { display: grid; grid-template-columns: 46px 1fr 46px; gap: 8px; align-items: center; }
    .day-plan-nav h3 { margin: 0; text-align: center; text-transform: capitalize; }
    .day-shift { font-weight: 750; font-size: 1.1rem; }
    .segment-list { display: grid; gap: 4px; }
    .segment-row { display: grid; grid-template-columns: 98px minmax(0, 1fr) auto; align-items: center; gap: 8px; margin: 0; }
    .segment-time { font-variant-numeric: tabular-nums; font-weight: 700; }
    .segment-title { overflow-wrap: anywhere; }
    .segment-actions { display: flex; gap: 4px; }
    .segment-actions button { min-height: 36px; padding: 5px 9px; font-size: .75rem; }
    .empty-segments { color: var(--muted); font-size: .85rem; }
    .overtime-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
    .overtime-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .overtime-heading h2 { margin-bottom: 8px; }
    .overtime-total { color: var(--muted); font-size: .8rem; font-weight: 650; }
    .changed-label { color: var(--danger); font-size: .65rem; }
    .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; margin: 14px 2px 16px; }
    .legend-item { display: inline-flex; gap: 5px; align-items: center; font-size: .68rem; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .dot.changed-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
    .empty { text-align: center; padding: 24px 16px; }
    .empty p { color: var(--muted); line-height: 1.5; }
    .actions { display: grid; gap: 8px; margin-top: 16px; }
    .notice { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: .8rem; line-height: 1.45; margin: 10px 0; }
    .notice.warn { color: #985b00; background: #fff0c2; }
    @media (prefers-color-scheme: dark) { .notice.warn { color: #ffe2a1; background: #4a3820; } }
    .sync-line { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: .72rem; color: var(--muted); padding: 0 3px; }
    .link-button { min-height: 34px; padding: 4px 8px; color: var(--blue-strong); background: transparent; border: 0; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: #06101ccc;
      padding: 12px 12px max(12px, env(safe-area-inset-bottom));
    }
    .sheet {
      width: min(100%, 520px);
      max-height: min(88vh, 760px);
      overflow: auto;
      padding: 20px 16px max(18px, env(safe-area-inset-bottom));
      border-radius: 20px 20px 12px 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .sheet-head h2 { margin: 0 0 4px; }
    .close { min-height: 40px; padding: 5px 12px; }
    .field { display: grid; gap: 5px; margin: 12px 0; }
    .field label { font-size: .78rem; font-weight: 650; color: var(--muted); }
    input, textarea {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--bg);
    }
    textarea { min-height: 90px; resize: vertical; }
    .time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0; }
    .chip { min-height: 38px; padding: 7px 11px; border-radius: 999px; font-size: .78rem; }
    .chip.active { background: var(--blue); color: white; border-color: var(--blue); }
    @media (prefers-color-scheme: dark) { .chip.active { color: #071523; } }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .sheet-actions .save { grid-column: span 2; }
    .segment-manager { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }
    .setup-label { overflow-wrap: anywhere; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 360px) {
      body { padding-left: 10px; padding-right: 10px; }
      .day-cell { min-height: 62px; font-size: .61rem; }
      .list-row { grid-template-columns: minmax(78px, 1fr) minmax(92px, 1.4fr); font-size: .8rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1 id="appTitle">Shift calendar</h1>
      <div class="lang" aria-label="Language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="pl">PL</button>
      </div>
    </header>
    <nav class="month-nav" aria-label="Month navigation">
      <button type="button" id="prevMonth" aria-label="Previous month">‹</button>
      <h2 id="monthTitle"></h2>
      <button type="button" id="todayButton"></button>
      <button type="button" id="nextMonth" aria-label="Next month">›</button>
    </nav>
    <section class="card next-card" aria-live="polite">
      <div class="next-title" id="nextTitle"></div>
      <div class="next-main" id="nextShift"></div>
      <div class="muted" id="nextLocation"></div>
    </section>
    <section class="card stats">
      <div>
        <div class="metric-label" id="hoursTitle"></div>
        <div class="hours-breakdown">
          <div><span class="hours-label" id="plannedHoursLabel"></span><strong class="hours-value" id="plannedHoursValue"></strong></div>
          <div>
            <span class="hours-label" id="actualHoursLabel"></span>
            <strong class="hours-value" id="actualHoursValue"></strong>
            <span class="hours-label" id="workedHoursHint"></span>
          </div>
        </div>
        <div class="subline" id="hoursSubline"></div>
      </div>
    </section>
    <div id="importNotice" class="notice" hidden></div>
    <div class="views" role="tablist">
      <button type="button" id="calendarView"></button>
      <button type="button" id="listView"></button>
      <button type="button" id="dayView"></button>
    </div>
    <section id="scheduleView" aria-live="polite"></section>
    <div class="legend" id="legend"></div>
    <div class="sync-line">
      <span id="syncStatus"></span>
      <button type="button" class="link-button" id="reloadButton" hidden></button>
      <button type="button" class="link-button" id="shareButton" hidden></button>
    </div>
    <section class="actions">
      <button type="button" id="replaceButton"></button>
      <button type="button" id="clearButton" class="ghost danger"></button>
      <button type="button" id="setupButton" class="ghost"></button>
    </section>
    <input id="jsonFile" class="sr-only" type="file" accept=".json,application/json">
  </main>
  <div id="modalRoot"></div>

        return `${hours.toLocaleString(locale(), { maximumFractionDigits: 2 })} ${tr("hoursUnit")}`;
      }
      function segmentOffset(shift, time) {
        const p = timeParts(shift || "");
        const match = String(time || "").match(/^(\d{2}):(\d{2})$/);
        if (!p || !match) return 0;
        let offset = +match[1] * 60 + +match[2] - (p[0] * 60 + p[1]);
        if (offset < 0) offset += 1440;
        return offset;
      }
      function renderLegend() {
        const root = $("legend");
        root.replaceChildren();
        for (const [kind, label] of [["early", "early"], ["mid", "mid"], ["late", "late"], ["night", "night"], ["off", "off"]]) {
          const item = document.createElement("span"); item.className = "legend-item";
          const dot = document.createElement("i"); dot.className = `dot color-${kind}`; dot.style.backgroundColor = `var(--${kind})`;
          const text = document.createElement("span"); text.textContent = tr(label);
          item.append(dot, text); root.append(item);
        }
        const changed = document.createElement("span"); changed.className = "legend-item";
        const dot = document.createElement("i"); dot.className = "dot changed-dot";
        const text = document.createElement("span"); text.textContent = tr("changed");
        changed.append(dot, text); root.append(changed);
      }
      function modal(content) {
        const root = $("modalRoot");
        root.replaceChildren();
        const backdrop = document.createElement("div"); backdrop.className = "modal-backdrop";
        backdrop.addEventListener("click", (e) => { if (e.target === backdrop) root.replaceChildren(); });
        const sheet = document.createElement("section"); sheet.className = "sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-modal", "true");
        sheet.append(content); backdrop.append(sheet); root.append(backdrop);
      }
      function field(label, type, value, placeholder = "") {
        const wrap = document.createElement("div"); wrap.className = "field";
        const l = document.createElement("label"); l.textContent = label;
        const input = document.createElement("input"); input.type = type; input.value = value || ""; input.placeholder = placeholder;
        wrap.append(l, input); return { wrap, input };
      }
      function openDayEditor(index) {
        const day = getMonth()[index];
        const date = new Date(+monthKey.slice(0, 4), +monthKey.slice(5) - 1, index + 1);
        const box = document.createElement("div");
        const head = document.createElement("div"); head.className = "sheet-head";
        const title = document.createElement("div");
        const h = document.createElement("h2"); h.textContent = dateLabel(date, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        const planned = document.createElement("div"); planned.className = "muted"; planned.textContent = tr("asPlanned", { value: day.os || tr("off") });
        title.append(h, planned);
        const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
        close.onclick = () => $("modalRoot").replaceChildren();
        head.append(title, close);
        const chips = document.createElement("div"); chips.className = "chips";
        const distinct = new Set(["", ...Object.values(data.m).flatMap((month) => Array.isArray(month) ? month.map((d) => d.s).filter(Boolean) : [])]);
        const startInput = field(tr("start"), "time", timeParts(day.s) ? day.s.slice(0, 5) : "");
        const endInput = field(tr("end"), "time", timeParts(day.s) ? day.s.slice(6) : "");
        function setCurrent(s) {
          startInput.input.value = s ? s.slice(0, 5) : "";
          endInput.input.value = s ? s.slice(6) : "";
          chips.querySelectorAll("button").forEach((c) => c.classList.toggle("active", c.dataset.shift === s));
        }
        for (const shift of distinct) {
          const chip = document.createElement("button"); chip.type = "button"; chip.className = "chip";
          chip.textContent = shift || tr("off"); chip.dataset.shift = shift;
          if (shift === (day.s || "")) chip.classList.add("active");
          chip.addEventListener("click", () => setCurrent(shift));
          chips.append(chip);
        }
        const times = document.createElement("div"); times.className = "time-fields"; times.append(startInput.wrap, endInput.wrap);
        const place = field(tr("location"), "text", day.o || "");
        const note = field(tr("note"), "text", day.n || "");
        const actions = document.createElement("div"); actions.className = "sheet-actions";
        const viewDay = document.createElement("button"); viewDay.type = "button"; viewDay.textContent = tr("viewDay");
        viewDay.onclick = () => { dayIndex = index; view = "day"; $("modalRoot").replaceChildren(); render(); };
        const cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = tr("cancel"); cancel.onclick = () => $("modalRoot").replaceChildren();
        const original = document.createElement("button"); original.type = "button"; original.textContent = tr("original");
        original.onclick = () => { setCurrent(day.os || ""); };
        const save = document.createElement("button"); save.type = "button"; save.className = "primary save"; save.textContent = tr("save");
        save.onclick = () => {
          if (Boolean(startInput.input.value) !== Boolean(endInput.input.value)) { alert(tr("timeError")); return; }
          const s = startInput.input.value && endInput.input.value ? `${startInput.input.value}-${endInput.input.value}` : "";
          if (s && !cleanTime(s)) { alert(tr("timeError")); return; }
          ensureMonth(monthKey);
          data.m[monthKey][index] = { ...data.m[monthKey][index], s: s ? cleanTime(s) : "", o: place.input.value.trim(), n: note.input.value.trim() };
          writeStore(); $("modalRoot").replaceChildren(); render(); scheduleCloudSave();
        };
        actions.append(viewDay, cancel, original, save);
        box.append(head, chips, times, place.wrap, note.wrap, actions);
        modal(box);
      }
      function openSegmentEditor(index, segmentIndex = -1) {
        const day = getMonth()[index];
        if (!day.s) return;
        const existing = Array.isArray(day.segments) ? day.segments[segmentIndex] : null;
        const orderedSegments = Array.isArray(day.segments)
          ? [...day.segments].sort((a, b) => segmentOffset(day.s, a.start) - segmentOffset(day.s, b.start))
          : [];
        const lastSegment = orderedSegments[orderedSegments.length - 1];
        const defaultStart = lastSegment ? lastSegment.end : day.s.slice(0, 5);
        const start = field(tr("start"), "time", existing ? existing.start : defaultStart);
        const end = field(tr("end"), "time", existing ? existing.end : day.s.slice(6));
        const what = field(tr("segmentName"), "text", existing ? existing.text : "");
        const box = document.createElement("div");
        const head = document.createElement("div"); head.className = "sheet-head";
        const title = document.createElement("h2"); title.textContent = tr("segments");
        const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
        close.onclick = () => $("modalRoot").replaceChildren();
        head.append(title, close);
        const times = document.createElement("div"); times.className = "time-fields"; times.append(start.wrap, end.wrap);
        const actions = document.createElement("div"); actions.className = "sheet-actions";
        const cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = tr("cancel"); cancel.onclick = () => $("modalRoot").replaceChildren();
        const save = document.createElement("button"); save.type = "button"; save.className = "primary save"; save.textContent = tr("save");
        save.onclick = () => {
          const startValue = start.input.value;
          const endValue = end.input.value;
          if (!Number.isFinite(clockMinutes(startValue)) || !Number.isFinite(clockMinutes(endValue)) || !what.input.value.trim()) {
            alert(tr("timeError")); return;
          }
          const startOffset = segmentOffset(day.s, startValue);
          const endOffset = segmentEndOffset(day.s, startValue, endValue);
          if (endOffset <= startOffset || startOffset >= shiftDuration(day.s) * 60 || endOffset > shiftDuration(day.s) * 60) {
            alert(tr("segmentOutsideShift")); return;
          }
          ensureMonth(monthKey);
          const target = data.m[monthKey][index];
          if (!Array.isArray(target.segments)) target.segments = [];
          const item = { start: startValue, end: endValue, text: what.input.value.trim() };
          if (segmentIndex >= 0) target.segments[segmentIndex] = item;
          else target.segments.push(item);
          writeStore(); $("modalRoot").replaceChildren(); render(); scheduleCloudSave();
        };
        actions.append(cancel, save);
        box.append(head, times, what.wrap, actions);
        modal(box);
      }
      function openOvertimeEditor(index, overtimeIndex = -1) {
        const day = getMonth()[index];
        const entries = Array.isArray(day.overtime) ? day.overtime : [];
        const existing = overtimeIndex >= 0 ? entries[overtimeIndex] : null;
        const lastEntry = entries[entries.length - 1];
        const defaultStart = lastEntry ? lastEntry.end : timeParts(day.s) ? day.s.slice(6) : "";
        const start = field(tr("start"), "time", existing ? existing.start : defaultStart);
        const end = field(tr("end"), "time", existing ? existing.end : "");
        const box = document.createElement("div");
        const head = document.createElement("div"); head.className = "sheet-head";
        const title = document.createElement("h2"); title.textContent = tr("overtime");
        const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
        close.onclick = () => $("modalRoot").replaceChildren();
        head.append(title, close);
        const times = document.createElement("div"); times.className = "time-fields"; times.append(start.wrap, end.wrap);
        const preview = document.createElement("div"); preview.className = "notice";
        const updatePreview = () => {
          const minutes = overtimeDurationMinutes(start.input.value, end.input.value);
          preview.textContent = minutes ? tr("overtimeDuration", { duration: formatMinutes(minutes) }) : tr("invalidOvertime");
        };
        start.input.addEventListener("input", updatePreview);
        end.input.addEventListener("input", updatePreview);
        updatePreview();
        const actions = document.createElement("div"); actions.className = "sheet-actions";
        const cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = tr("cancel"); cancel.onclick = () => $("modalRoot").replaceChildren();
        const save = document.createElement("button"); save.type = "button"; save.className = "primary save"; save.textContent = tr("save");
        save.onclick = () => {
          const minutes = overtimeDurationMinutes(start.input.value, end.input.value);
          if (!Number.isFinite(clockMinutes(start.input.value)) || !Number.isFinite(clockMinutes(end.input.value)) || !minutes) {
            alert(tr("invalidOvertime")); return;
          }
          ensureMonth(monthKey);
          const target = data.m[monthKey][index];
          if (!Array.isArray(target.overtime)) target.overtime = [];
          const item = { start: start.input.value, end: end.input.value };
          if (overtimeIndex >= 0) target.overtime[overtimeIndex] = item;
          else target.overtime.push(item);
          writeStore(); $("modalRoot").replaceChildren(); render(); scheduleCloudSave();
        };
        actions.append(cancel, save);
        box.append(head, times, preview, actions);
        modal(box);
      }
      function twoTap(which, action) {
        const isReplace = which === "replace";
        const state = isReplace ? pendingJsonReplace : pendingClear;
        if (!state) {
          if (isReplace) pendingJsonReplace = true; else pendingClear = true;
          render();
          setTimeout(() => {
            if (isReplace) pendingJsonReplace = false; else pendingClear = false;
            render();
          }, 4000);
          return;
        }
        if (isReplace) pendingJsonReplace = false; else pendingClear = false;
        render();
        action();
      }
      async function importScheduleJson(file) {
        if (!file || !/\.json$/i.test(file.name)) {
          showImportNotice(tr("invalidJson"), true);
          return;
        }
        try {
          const parsed = JSON.parse(await file.text());
          if (!parsed || !validMonthKey(parsed.month) || !Array.isArray(parsed.days)) throw new Error("invalid_json_shape");
          const importedMonth = parsed.month;
          const count = daysInMonth(importedMonth);
          if (!parsed.days.length) throw new Error("empty_days");
          const existing = Array.isArray(data.m[importedMonth]) ? data.m[importedMonth] : [];
          data.m[importedMonth] = Array.from({ length: count }, (_, i) => {
            const entry = parsed.days[i] || {};
            const s = cleanTime(entry.s) || "";
            return {
              s,
              os: s,
              o: existing[i] && typeof existing[i].o === "string" ? existing[i].o : "",
              n: typeof entry.n === "string" ? entry.n.trim() : ""
            };
          });
          monthKey = importedMonth;
          if (!writeStore()) throw new Error("local_storage_write_failed");
          const mismatch = parsed.days.length !== count;
          const monthName = dateLabel(monthDate(importedMonth), { month: "long", year: "numeric" });
          showImportNotice(cloud.id && cloud.token
            ? tr("savingImport")
            : tr("importedLocal"), mismatch);
          render();
          const savedToCloud = await scheduleCloudSave();
          if (cloud.id && cloud.token) {
            showImportNotice(savedToCloud
              ? (mismatch ? tr("importCount", { found: parsed.days.length, days: count }) : tr("importedShared"))
              : tr("importCloudFailed"), !savedToCloud || mismatch);
          }
        } catch (error) {
          console.error("Schedule JSON import failed", error);
          showImportNotice(error && error.message === "local_storage_write_failed" ? tr("localImportFailed") : tr("invalidJson"), true);
        } finally {
          $("jsonFile").value = "";
        }
      }

      async function rpc(name, payload) {
        const base = cloud.url.replace(/\/+$/, "");
        const response = await fetch(`${base}/rest/v1/rpc/${name}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: cloud.key, Authorization: `Bearer ${cloud.key}` },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.json();
      }
      function scheduleCloudSave() {
        if (!cloud.id || !cloud.token) return Promise.resolve(true);
        if (cloudConflict) return Promise.resolve(false);
        cloudDirty = true;
        clearTimeout(saveTimer);
        $("syncStatus").textContent = tr("syncPending");
        const savePromise = new Promise((resolve) => saveWaiters.push(resolve));
        saveTimer = setTimeout(flushCloudSave, 500);
        return savePromise;
      }
      async function flushCloudSave() {
        if (cloudSaveInFlight) {
          saveTimer = setTimeout(flushCloudSave, 100);
          return;
        }
        cloudSaveInFlight = true;
        const waiters = saveWaiters;
        saveWaiters = [];
        try {
          const nextRevision = await rpc("shift_calendar_save", { p_id: cloud.id, p_token: cloud.token, p_revision: cloud.revision, p_data: data });
          const revision = Number(nextRevision);
          if (nextRevision === null || !Number.isFinite(revision) || revision <= cloud.revision) {
            cloudConflict = true;
            render();
            waiters.forEach((resolve) => resolve(false));
            return;
          }
          cloud.revision = revision;
          cloudDirty = saveWaiters.length > 0;
          saveCloudConfig();
          $("syncStatus").textContent = cloudDirty ? tr("syncPending") : tr("synced");
          waiters.forEach((resolve) => resolve(true));
        } catch (error) {
          console.error("Cloud calendar save failed", error);
          $("syncStatus").textContent = tr("syncError");
          waiters.forEach((resolve) => resolve(false));
        } finally {
          cloudSaveInFlight = false;
          if (saveWaiters.length && !saveTimer) saveTimer = setTimeout(flushCloudSave, 0);
        }
      }
      async function pullCloud(silent = false) {
        if (!cloud.id || !cloud.token) return;
        try {
          const result = await rpc("shift_calendar_get", { p_id: cloud.id, p_token: cloud.token });
          if (!result) throw new Error("calendar_not_found");
          const remoteRevision = Number(result.revision);
          if (!Number.isFinite(remoteRevision) || !result.data || !result.data.m || typeof result.data.m !== "object") {
            throw new Error("invalid_shared_calendar_data");
          }
          if (remoteRevision > cloud.revision) {
            if (cloudDirty) {
              cloudConflict = true;
              render();
              return;
            }
          }
          if (remoteRevision >= cloud.revision && !cloudDirty) {
            data = result.data;
            cloud.revision = remoteRevision;
            writeStore(); saveCloudConfig(); render();
          }
          cloudConflict = false;
          if (!silent) $("syncStatus").textContent = tr("synced");
        } catch (error) {
          console.error("Cloud calendar load failed", error);
          $("syncStatus").textContent = tr("syncError");
          if (!silent) alert(tr("setupFail"));
        }
      }
      function openSetup() {
        const box = document.createElement("div");
        const head = document.createElement("div"); head.className = "sheet-head";
        const title = document.createElement("h2"); title.textContent = tr("setupTitle");
        const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
        close.onclick = () => $("modalRoot").replaceChildren();
        head.append(title, close);
        const text = document.createElement("p"); text.className = "muted"; text.textContent = tr("setupText");
        const url = field(tr("projectUrl"), "url", cloud.url, "https://your-project.supabase.co");
        const key = field(tr("anonKey"), "text", cloud.key);
        const sql = document.createElement("textarea"); sql.value = setupSql; sql.readOnly = true; sql.setAttribute("aria-label", "SQL setup");
        const copySql = document.createElement("button"); copySql.type = "button"; copySql.textContent = tr("copySql");
        copySql.onclick = async () => { try { await navigator.clipboard.writeText(setupSql); copySql.textContent = tr("sqlCopied"); } catch (e) { sql.select(); document.execCommand("copy"); copySql.textContent = tr("sqlCopied"); } };
        const create = document.createElement("button"); create.type = "button"; create.className = "primary"; create.textContent = tr("createShared");
        create.onclick = async () => {
          cloud.url = url.input.value.trim().replace(/\/+$/, "");
          cloud.key = key.input.value.trim();
          if (!cloud.url || !cloud.key) { alert(tr("setupMissing")); return; }
          cloud.id = crypto.randomUUID();
          const bytes = crypto.getRandomValues(new Uint8Array(32));
          cloud.token = Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
          cloud.revision = 0;
          saveCloudConfig();
          try {
            const revision = await rpc("shift_calendar_save", { p_id: cloud.id, p_token: cloud.token, p_revision: 0, p_data: data });
            if (revision === null) throw new Error("save_rejected");
            cloud.revision = Number(revision); saveCloudConfig();
            $("modalRoot").replaceChildren(); render(); showShare();
            pollTimer = setInterval(() => pullCloud(true), 12000);
          } catch (error) {
            console.error("Shared calendar setup failed", error);
            cloud.id = ""; cloud.token = ""; cloud.revision = 0;
            saveCloudConfig(); alert(tr("setupFail"));
          }
        };
        const linkBtn = document.createElement("button"); linkBtn.type = "button"; linkBtn.textContent = tr("connectLink");
        linkBtn.onclick = async () => {
          cloud.url = url.input.value.trim().replace(/\/+$/, "");
          cloud.key = key.input.value.trim();
          if (!cloud.url || !cloud.key) { alert(tr("setupMissing")); return; }
          saveCloudConfig();
          const shared = new URLSearchParams(location.hash.slice(1));
          const id = shared.get("i") || cloud.id;
          const token = shared.get("t") || cloud.token;
          if (!id || !token) { alert(tr("setupFail")); return; }
          cloud.id = id; cloud.token = token; cloud.revision = 0; saveCloudConfig();
          try {
            const result = await rpc("shift_calendar_get", { p_id: cloud.id, p_token: cloud.token });
            if (!result) throw new Error("calendar_not_found");
            data = result.data;
            cloud.revision = Number(result.revision); writeStore(); saveCloudConfig();
            $("modalRoot").replaceChildren(); render();
            clearInterval(pollTimer); pollTimer = setInterval(() => pullCloud(true), 12000);
          } catch (error) { console.error("Shared calendar connection failed", error); alert(tr("setupFail")); }
        };
        box.append(head, text, url.wrap, key.wrap, sql, copySql, create, linkBtn);
        modal(box);
      }
      async function showShare() {
        if (location.protocol !== "https:") {
          const box = document.createElement("div");
          const head = document.createElement("div"); head.className = "sheet-head";
          const title = document.createElement("h2"); title.textContent = tr("shareTitle");
          const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
          close.onclick = () => $("modalRoot").replaceChildren();
          head.append(title, close);
          const warning = document.createElement("p"); warning.className = "notice warn"; warning.textContent = tr("hostingRequired");
          box.append(head, warning);
          modal(box);
          return;
        }
        const url = new URL(location.href);
        const params = new URLSearchParams();
        params.set("u", cloud.url); params.set("k", cloud.key); params.set("i", cloud.id); params.set("t", cloud.token);
        url.hash = params.toString();
        const box = document.createElement("div");
        const head = document.createElement("div"); head.className = "sheet-head";
        const title = document.createElement("h2"); title.textContent = tr("shareTitle");
        const close = document.createElement("button"); close.type = "button"; close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", tr("close"));
        close.onclick = () => $("modalRoot").replaceChildren(); head.append(title, close);
        const warning = document.createElement("p"); warning.className = "notice warn"; warning.textContent = tr("editLinkWarning");
        const link = document.createElement("div"); link.className = "field";
        const label = document.createElement("label"); label.textContent = tr("linkLabel");
        const input = document.createElement("textarea"); input.readOnly = true; input.value = url.href; input.className = "setup-label";
        const copy = document.createElement("button"); copy.type = "button"; copy.className = "primary"; copy.textContent = tr("share");
        copy.onclick = async () => { try { await navigator.clipboard.writeText(url.href); copy.textContent = tr("copied"); } catch (error) { input.select(); document.execCommand("copy"); copy.textContent = tr("copied"); } };
        link.append(label, input);
        box.append(head, warning, link, copy); modal(box);
        try { await navigator.clipboard.writeText(url.href); copy.textContent = tr("copied"); } catch (error) { /* Link remains selectable in the sheet. */ }
      }
      function reloadShared() { cloudConflict = false; cloudDirty = false; cloud.revision = 0; pullCloud(false); }

      $("prevMonth").addEventListener("click", () => {
        const d = monthDate(monthKey); d.setMonth(d.getMonth() - 1); monthKey = currentMonthKey(d);
        dayIndex = Math.min(dayIndex, daysInMonth(monthKey) - 1); render();
      });
      $("nextMonth").addEventListener("click", () => {
        const d = monthDate(monthKey); d.setMonth(d.getMonth() + 1); monthKey = currentMonthKey(d);
        dayIndex = Math.min(dayIndex, daysInMonth(monthKey) - 1); render();
      });
      $("todayButton").addEventListener("click", () => { monthKey = currentMonthKey(); dayIndex = new Date().getDate() - 1; render(); });
      $("calendarView").addEventListener("click", () => { view = "calendar"; render(); });
      $("listView").addEventListener("click", () => { view = "list"; render(); });
      $("dayView").addEventListener("click", () => {
        if (monthKey === currentMonthKey()) dayIndex = new Date().getDate() - 1;
        view = "day"; render();
      });
      document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLanguage(b.dataset.lang)));
      $("jsonFile").addEventListener("change", (e) => importScheduleJson(e.target.files[0]));
      $("replaceButton").addEventListener("click", () => twoTap("replace", () => $("jsonFile").click()));
      $("clearButton").addEventListener("click", () => twoTap("clear", () => {
        delete data.m[monthKey]; importNoticeKey = ""; writeStore(); $("importNotice").hidden = true; render(); scheduleCloudSave();
      }));
      $("setupButton").addEventListener("click", openSetup);
      $("shareButton").addEventListener("click", showShare);
      $("reloadButton").addEventListener("click", reloadShared);
      readStore();
      monthKey = findInitialMonth();
      dayIndex = monthKey === currentMonthKey() ? new Date().getDate() - 1 : 0;
      render();
      if (cloud.id && cloud.token) {
        pullCloud(false);
        pollTimer = setInterval(() => pullCloud(true), 12000);
      }
      window.addEventListener("online", () => { if (cloud.id) pullCloud(true); });
    })();
  </script>
</body>
</html>
